services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-c2user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-c2pass}
      POSTGRES_DB: ${POSTGRES_DB:-c2db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-c2user} -d ${POSTGRES_DB:-c2db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 3g
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-neo4jpassword}
      NEO4J_server_memory_heap_max__size: 5G
      NEO4J_server_memory_pagecache_size: 3G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 8g
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - RUN_MIGRATIONS=1   # chỉ backend chạy alembic upgrade head lúc start (tránh race với worker)
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m arq backend.worker.WorkerSettings
    env_file:
      - .env
    environment:
      - OMP_NUM_THREADS=1       # NFR4: chống CPU thrashing với Deep Learning libs
      - OPENBLAS_NUM_THREADS=1  # NFR4: chống CPU thrashing với Deep Learning libs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      neo4j:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    mem_limit: 12g  # ARCH-1: arq worker limit 12GB
    healthcheck:
      disable: true

volumes:
  postgres_data:
  neo4j_data:
