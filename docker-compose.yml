services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-c2user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-c2pass}
      POSTGRES_DB: ${POSTGRES_DB:-c2db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-c2user} -d ${POSTGRES_DB:-c2db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 3g
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m arq backend.worker.WorkerSettings
    env_file:
      - .env
    environment:
      - OMP_NUM_THREADS=1       # NFR4: chống CPU thrashing với Deep Learning libs
      - OPENBLAS_NUM_THREADS=1  # NFR4: chống CPU thrashing với Deep Learning libs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    mem_limit: 12g  # ARCH-1: arq worker limit 12GB
    healthcheck:
      disable: true

volumes:
  postgres_data:
